<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Provided design system</title><style>/* A provided design system from another document family (copied, comments stripped), used to prove
   that the skill adopts a provided system instead of its own default. */

:root {
  --ink:#15181d; --quiet:#545b66; --rule:#dfe2e7; --line:#8b95a3; --paper:#ffffff; --panel:#f6f7f9;
  --accent:#1f4e8c; --accent-soft:#e8eff9;
  --good:#276b33; --good-bg:#e5f4e4; --warn:#855300; --warn-bg:#fdf1d6;
  --info:#1f5fa8; --info-bg:#e7f1fb; --crit:#b42318; --crit-bg:#fbebeb; --mute:#585e68; --mute-bg:#f0efec; --on-accent:#ffffff;
  --font:"Inter", -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --mono:"JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink:#e8eaed; --quiet:#a6adb8; --rule:#333a44; --line:#7d8794; --paper:#14161a; --panel:#1b1e23;
    --accent:#8fb4ea; --accent-soft:#1c2a3e; --good:#6cc47a; --good-bg:#1c2e20; --warn:#e0b050; --warn-bg:#33291a;
    --info:#7fb0ec; --info-bg:#1a2636; --crit:#f08a80; --crit-bg:#3a1f1f; --mute:#9aa1ab; --mute-bg:#24262b; --on-accent:#14161a; color-scheme: dark;
  }
}

[data-theme="light"] {
  --ink:#15181d; --quiet:#545b66; --rule:#dfe2e7; --line:#8b95a3; --paper:#ffffff; --panel:#f6f7f9;
  --accent:#1f4e8c; --accent-soft:#e8eff9;
  --good:#276b33; --good-bg:#e5f4e4; --warn:#855300; --warn-bg:#fdf1d6;
  --info:#1f5fa8; --info-bg:#e7f1fb; --crit:#b42318; --crit-bg:#fbebeb; --mute:#585e68; --mute-bg:#f0efec; --on-accent:#ffffff; color-scheme: light; }
:root[data-theme="dark"], [data-theme="dark"] {
  --ink:#e8eaed; --quiet:#a6adb8; --rule:#333a44; --line:#7d8794; --paper:#14161a; --panel:#1b1e23;
  --accent:#8fb4ea; --accent-soft:#1c2a3e; --good:#6cc47a; --good-bg:#1c2e20; --warn:#e0b050; --warn-bg:#33291a;
  --info:#7fb0ec; --info-bg:#1a2636; --crit:#f08a80; --crit-bg:#3a1f1f; --mute:#9aa1ab; --mute-bg:#24262b; --on-accent:#14161a; color-scheme: dark;
}
* { box-sizing: border-box; }
[data-theme] { background:var(--paper); color:var(--ink); }
html, body { margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 var(--font); font-variant-numeric: lining-nums; }
main { max-width: 820px; margin: 0 auto; padding: 48px 20px 72px; }
.kicker { font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--accent); }
h1 { font-size:40px; line-height:1.12; margin:10px 0 12px; letter-spacing:-.01em; }
.dek { font-size:20px; color:var(--quiet); margin:0 0 28px; max-width:36em; }
.meta { font-size:14px; color:var(--quiet); border-bottom:3px solid var(--accent); padding-bottom:16px; margin-bottom:28px; }
h2 { font-size:26px; line-height:1.22; margin:48px 0 10px; letter-spacing:-.005em; }
h3 { font-size:14px; text-transform:uppercase; letter-spacing:.07em; color:var(--quiet); margin:28px 0 8px; }
p, li { max-width: 40em; }
p.meta, p.leaves { max-width:none; }   
ul, ol { padding-left:22px; } li { margin:5px 0; } li > p { margin:0; }
a { color:var(--accent); text-underline-offset:2px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.num, td.num { font-variant-numeric: tabular-nums lining-nums; } td.num { text-align:right; }
code { font:0.88em var(--mono); background:var(--panel); padding:1px 5px; border-radius:4px; }

.callout { border-left:5px solid var(--info); background:var(--info-bg); border-radius:8px; padding:14px 18px; margin:14px 0 22px; }
.callout.good { border-color:var(--good); background:var(--good-bg); } .callout.warn { border-color:var(--warn); background:var(--warn-bg); }
.callout .label { display:block; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--info); margin-bottom:4px; }
.callout.good .label { color:var(--good); } .callout.warn .label { color:var(--warn); }
.callout p { margin:0; }

.st { display:inline-block; border-radius:5px; padding:0 7px; font-size:.82em; font-weight:700; white-space:nowrap; }
.st-live { background:var(--good-bg); color:var(--good); } .st-bnd { background:var(--info-bg); color:var(--info); }
.st-designed, .st-unconfirmed { background:var(--warn-bg); color:var(--warn); }
.st-inert, .st-notbuilt, .st-retired { background:var(--mute-bg); color:var(--mute); }

.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin:18px 0 26px; }
.card { border:1px solid var(--rule); border-top:5px solid var(--good); border-radius:10px; padding:14px 16px; }
.card.warn { border-top-color:var(--warn); } .card.info { border-top-color:var(--info); }
.card b { display:block; font-size:16.5px; margin-bottom:4px; } .card p { margin:0; font-size:15.5px; color:var(--quiet); }

table { width:100%; border-collapse:collapse; margin:14px 0 22px; font-size:15px; line-height:1.45; }
th { text-align:left; background:var(--panel); font-weight:600; }
th, td { border:1px solid var(--rule); padding:8px 10px; vertical-align:top; }

.exsum { border:2px solid var(--accent); border-radius:12px; padding:6px 26px 0; margin:6px 0 34px; }
.exsum h2 { margin-top:22px; font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); }
.exsum-end { margin:20px -26px 0; padding:9px 26px; background:var(--accent); color:var(--on-accent); font-size:12px; font-weight:700;
  text-transform:uppercase; letter-spacing:.1em; border-radius:0 0 9px 9px; }
.toc { background:var(--panel); border:1px solid var(--rule); border-radius:10px; padding:14px 20px; font-size:15px; margin:0 0 10px; }
.toc ol { margin:6px 0 0; padding-left:20px; columns:2; column-gap:28px; } .toc li { break-inside:avoid; }

.leaves { border-top:1px solid var(--rule); padding-top:12px; margin-top:28px; color:var(--quiet); font-size:15.5px; }
.next { background:var(--accent-soft); border-radius:10px; padding:14px 18px; margin:22px 0; }
.next b { color:var(--accent); }

figure { margin:24px 0 30px; }
figure .fig { border:1px solid var(--rule); border-radius:12px; padding:10px; background:var(--paper); }
figure svg { display:block; width:100%; height:auto; font-family:var(--font); }
figcaption { font-size:14.5px; color:var(--quiet); margin-top:8px; }
.explainer-link { display:inline-block; margin-top:6px; font-size:14px; font-weight:600; }
.foot { margin-top:44px; padding-top:14px; border-top:1px solid var(--rule); color:var(--quiet); font-size:13.5px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }

svg .t { fill:var(--ink); } svg .tq { fill:var(--quiet); } svg .ta { fill:var(--accent); } svg .tg { fill:var(--good); } svg .tw { fill:var(--warn); }
svg .ti { fill:var(--info); } svg .tc { fill:var(--crit); } svg .tm { fill:var(--mute); } svg .ton { fill:var(--on-accent); }
svg .bx { fill:var(--paper); stroke:var(--line); stroke-width:1.25; } svg .bxp { fill:var(--panel); stroke:var(--rule); stroke-width:1.25; }
svg .bxa { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.25; } svg .bxg { fill:var(--good-bg); stroke:var(--good); stroke-width:1.25; }
svg .bxw { fill:var(--warn-bg); stroke:var(--warn); stroke-width:1.25; } svg .bxi { fill:var(--info-bg); stroke:var(--info); stroke-width:1.25; }
svg .bxc { fill:var(--crit-bg); stroke:var(--crit); stroke-width:1.25; } svg .bxm { fill:var(--mute-bg); stroke:var(--mute); stroke-width:1.25; }
svg .bxd { fill:var(--paper); stroke:var(--line); stroke-width:1.25; stroke-dasharray:5 4; }
svg .ln { stroke:var(--line); stroke-width:1.25; fill:none; } svg .lna { stroke:var(--accent); stroke-width:2; fill:none; }
svg .lng { stroke:var(--good); stroke-width:2; fill:none; } svg .lnw { stroke:var(--warn); stroke-width:2; fill:none; }
svg .lnd { stroke:var(--line); stroke-width:1.25; fill:none; stroke-dasharray:6 5; }
svg .lno { stroke:var(--good); stroke-width:2; fill:none; stroke-dasharray:2 5; stroke-linecap:round; }
svg .lnr { stroke:var(--rule); stroke-width:1; fill:none; }
svg .lnx { stroke:var(--crit); stroke-width:2; fill:none; stroke-dasharray:3 6; }
svg .fa { fill:var(--accent); } svg .fg { fill:var(--good); } svg .fl { fill:var(--line); }
svg .fw { fill:var(--warn); } svg .fi { fill:var(--info); } svg .fc { fill:var(--crit); } svg .fm { fill:var(--mute); } svg .fp { fill:var(--panel); }
svg path, svg line, svg polyline { stroke-linejoin:round; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
@media (max-width: 640px) { h1 { font-size:31px; } .toc ol { columns:1; } }
@page { size: Letter; margin: 0.6in 0.65in 0.7in; }
@media print {
  html, body { font-size:14.5px; }
  main { padding:0; max-width:none; }
  h2 { break-after:avoid; } h3 { break-after:avoid; }
  .callout, .card, figure, tr, .exsum, .next { break-inside:avoid; }
  .page-break { break-before:page; }
  .exsum { break-after:page; }
  a { color:var(--accent); }
  .explainer-link { display:none; }
}

@media print {
  main:is(.compact,.onepage) { font-size:13px; line-height:1.42; }
  main:is(.compact,.onepage) .kicker { font-size:10.5px; }
  main:is(.compact,.onepage) h1 { font-size:25px; margin:4px 0 6px; }
  main:is(.compact,.onepage) .dek { font-size:14.5px; margin:0 0 8px; }
  main:is(.compact,.onepage) .meta { font-size:11.5px; padding-bottom:8px; margin-bottom:10px; border-bottom-width:2px; }
  main:is(.compact,.onepage) h2 { font-size:17px; margin:14px 0 6px; }
  main:is(.compact,.onepage) .callout { margin:8px 0 10px; padding:8px 12px; }
  main:is(.compact,.onepage) .cards { gap:8px; margin:8px 0 10px; grid-template-columns:repeat(3, 1fr); }
  main:is(.compact,.onepage) .card { padding:8px 10px; } main:is(.compact,.onepage) .card b { font-size:13.5px; } main:is(.compact,.onepage) .card p { font-size:12.5px; }
  main:is(.compact,.onepage) ul, main:is(.compact,.onepage) ol { margin:6px 0; } main:is(.compact,.onepage) li { margin:2px 0; }
  main:is(.compact,.onepage) table { font-size:12px; margin:8px 0 10px; } main:is(.compact,.onepage) th, main:is(.compact,.onepage) td { padding:4px 7px; }
  main:is(.compact,.onepage) figure { margin:8px 0 8px; } main:is(.compact,.onepage) figure .fig { padding:6px; }
  main:is(.compact,.onepage) figure svg { max-height:2.5in; } main:is(.compact,.onepage) figcaption { font-size:11.5px; margin-top:4px; }
  main:is(.compact,.onepage) .leaves { margin-top:10px; padding-top:6px; font-size:12px; }
  main:is(.compact,.onepage) .next { margin:8px 0; padding:8px 12px; }
  main:is(.compact,.onepage) .foot { margin-top:10px; padding-top:6px; font-size:10.5px; }
}
